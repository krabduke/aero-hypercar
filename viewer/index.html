<!doctype html>
<html lang="en">
<head>

<title>VX-1 Vortex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1113'/%3E%3Cpath d='M3 20 L9 14 L23 14 L29 20 Z' fill='%23C06A30'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#15181B;
    --panel:#CBCCC7;
    --panel-dim:#B6B8B2;
    --ink:#141618;
    --ink-soft:#5D6165;
    --rule:#9C9E99;
    --focus:#B05A22;
    --ours:#D8762F;
    --f1:#7E8894;
    --rail-h:134px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--void); color:var(--panel);
       font-family:Archivo,system-ui,-apple-system,sans-serif; font-size:14px;
       -webkit-font-smoothing:antialiased; overflow:hidden}
  canvas{display:block; touch-action:none}
  #stage{position:fixed; inset:0 0 var(--rail-h) 0}

  #title{position:fixed; top:20px; left:24px; z-index:5; pointer-events:none;
         text-shadow:0 1px 16px rgba(0,0,0,.8)}
  #title h1{margin:0; font-size:21px; font-weight:700; letter-spacing:-.02em}
  #title p{margin:2px 0 0; font-size:12.5px; color:#8E969C}

  #spec{position:fixed; top:20px; right:24px; z-index:5; pointer-events:none;
        text-align:right; display:grid; gap:1px; text-shadow:0 1px 16px rgba(0,0,0,.8)}
  #spec div{font-size:12.5px; color:#8E969C; font-variant-numeric:tabular-nums}
  #spec b{color:var(--panel); font-weight:600}

  /* the argument of the whole car, drawn: grip against speed, versus F1 */
  #grip{position:fixed; left:24px; bottom:calc(var(--rail-h) + 18px); z-index:5;
        width:330px; pointer-events:none}
  #grip .cap{font-size:11px; color:#98A0A6; margin-bottom:7px}
  #grip svg{display:block; width:100%; height:132px; overflow:visible}
  #grip .leg{display:flex; gap:16px; margin-top:6px; font-size:11px}
  #grip .leg i{display:inline-block; width:14px; height:2px; margin-right:6px;
               vertical-align:middle}
  #grip .leg .a{color:#D8762F} #grip .leg .b{color:#8E969C}

  #probe{position:fixed; right:24px; bottom:calc(var(--rail-h) + 18px); z-index:5;
         min-width:210px; max-width:min(320px,44vw); padding:10px 13px;
         background:rgba(14,17,19,.9); backdrop-filter:blur(8px);
         border:1px solid #2C3134; border-left:3px solid var(--pa,#C06A30);
         opacity:0; transition:opacity .12s ease; pointer-events:none}
  #probe.on{opacity:1}
  #probe .nm{font-size:14px; font-weight:600; color:#E7E9E4; word-break:break-word}
  #probe .md{font-size:12px; color:#8A9298; margin-top:1px}
  #probe dl{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:8px 0 0;
            font-size:12px; font-variant-numeric:tabular-nums}
  #probe dt{color:#767E84} #probe dd{margin:0; text-align:right; color:#CBCCC7}

  #rail{position:fixed; left:0; right:0; bottom:0; z-index:6; height:var(--rail-h);
        background:var(--panel); color:var(--ink);
        box-shadow:0 -16px 40px rgba(0,0,0,.5);
        display:grid; grid-template-rows:auto auto 1fr}
  #railhead{display:flex; align-items:baseline; justify-content:space-between;
            gap:14px; padding:9px 24px 0}
  #railhead h2{margin:0; font-size:12.5px; font-weight:600}
  #railhead span{font-size:11.5px; color:var(--ink-soft)}
  #groups{display:flex; flex-wrap:wrap; gap:6px; padding:9px 24px 0}
  .grp{border:1px solid var(--rule); background:transparent; color:var(--ink);
       font:inherit; font-size:11.5px; font-weight:500; padding:4px 10px;
       cursor:pointer; outline-offset:2px; transition:background .13s ease}
  .grp:hover{background:var(--panel-dim)}
  .grp:focus-visible{outline:2px solid var(--focus)}
  .grp[aria-pressed="false"]{color:#8E908B; border-color:#BFC1BC}
  .grp .sw{display:inline-block; width:8px; height:8px; margin-right:6px;
           background:var(--c); vertical-align:baseline}
  .grp[aria-pressed="false"] .sw{background:#BFC1BC}
  .grp .ct{color:var(--ink-soft); margin-left:5px; font-weight:400}
  #controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
            padding:0 24px 11px; margin-top:8px}
  .btn{border:1px solid var(--rule); background:transparent; color:var(--ink);
       font:inherit; font-size:11.5px; font-weight:500; padding:4px 11px;
       cursor:pointer; outline-offset:2px}
  .btn:hover{background:var(--panel-dim)}
  .btn:focus-visible{outline:2px solid var(--focus)}
  .btn[aria-pressed="true"]{background:var(--ink); color:var(--panel)}

  #load{position:fixed; inset:0; z-index:9; display:grid; place-content:center;
        gap:12px; background:var(--void); text-align:center; transition:opacity .4s}
  #load.done{opacity:0; pointer-events:none}
  #load p{margin:0; font-size:13px; color:#8A9298; font-variant-numeric:tabular-nums}
  #bar{width:210px; height:2px; background:#282C2F; overflow:hidden}
  #bar i{display:block; height:100%; width:0%; background:var(--ours); transition:width .2s}
  #err{color:#D08A6A; font-size:12.5px; max-width:330px; line-height:1.5}

  @media (max-width:860px){
    :root{--rail-h:176px}
    #grip{display:none}
    #title h1{font-size:18px}
    #spec div:nth-child(n+4){display:none}
    #probe{left:16px; right:16px; max-width:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
  /* --- wind tunnel ---------------------------------------------------- */
  /* An instrument panel, not a dashboard: the numbers are the content, so
     they get a tabular monospace face and everything else stays quiet. */
  #tunnel{
    position:absolute; left:16px; top:96px; width:302px; z-index:6;
    display:none;
  }
  #tunnel.on{display:block}
  .twrap{
    background:rgba(16,22,25,.93); border:1px solid #2C383E; border-radius:3px;
    padding:12px 13px 10px;
  }
  .thead{display:flex; justify-content:space-between; align-items:baseline;
         border-bottom:1px solid #2C383E; padding-bottom:7px; margin-bottom:9px}
  .tt{font-weight:600; font-size:13px; letter-spacing:.01em}
  .ts{font-size:11px; color:#6E7D86; font-variant-numeric:tabular-nums}
  .trow{display:grid; grid-template-columns:82px 1fr 54px; align-items:center;
        gap:8px; margin:7px 0}
  .tlab{font-size:11px; color:#96A3AB}
  .trow output{font-size:11px; color:#DCE6EB; text-align:right;
               font-variant-numeric:tabular-nums}
  .trow input[type=range]{
    -webkit-appearance:none; appearance:none; height:2px; background:#36444B;
    border-radius:2px; outline:none;
  }
  .trow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#8FB9CE; cursor:grab; border:2px solid #101619;
  }
  .trow input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background:#8FB9CE;
    cursor:grab; border:2px solid #101619;
  }
  .trow input[type=range]:focus-visible{outline:2px solid #8FB9CE; outline-offset:3px}
  .treadout{margin-top:11px; border-top:1px solid #2C383E; padding-top:9px}
  .treadout .tr{display:flex; justify-content:space-between; padding:2.5px 0}
  .treadout dt{font-size:11px; color:#96A3AB}
  .treadout dd{font-size:11.5px; margin:0; font-variant-numeric:tabular-nums;
               color:#E6EEF2}
  .tplot{margin-top:10px}
  .tcap{font-size:10px; color:#6E7D86; margin-bottom:3px}
  #t-span{width:100%; height:76px; display:block}
  .tnote{font-size:10.5px; line-height:1.45; color:#7C8A92; margin:9px 0 0}
  .tnote.warn{color:#E0A05A}
  .tstatus{font-size:10.5px; color:#7FB2C9; min-height:13px; margin:-4px 0 6px}
  .tstatus.busy{color:#E0A05A}
  #t-legend{width:100%; height:46px; display:block}
  .tabout{font-size:10.5px; line-height:1.5; color:#8A969D;
          margin:8px 0 0; padding-top:8px; border-top:1px solid #2C383E}


/* ---- wind tunnel: view switches and the how-to-read line ---- */
#tunnel .tviews{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;
  margin:8px 0 2px;padding-top:8px;border-top:1px solid #1E282D}
#tunnel .tview{display:flex;align-items:center;gap:6px;font-size:11px;
  color:#9FADB5;cursor:pointer;line-height:1.5}
#tunnel .tview input{accent-color:#7FB2C9;width:12px;height:12px;margin:0}
#tunnel .tview:hover{color:#DCE6EB}
#tunnel .thow{margin:6px 0 0;font-size:10.5px;line-height:1.45;color:#6E7C84}
@media (prefers-reduced-motion: reduce){
  /* the arrows carry direction without motion, so the pulse can stop */
  #tunnel .tview input#tv-anim{outline:1px dashed #46555E}
}
</style>

<body>

<div id="stage"></div>

<div id="title">
  <h1>VX-1 Vortex</h1>
  <p>Ground-effect fan car · built to beat F1 on an F1 circuit</p>
</div>

<div id="spec">
  <div><b id="s-dim">—</b> mm</div>
  <div><b id="s-mass">—</b> kg</div>
  <div><b id="s-pwr">—</b> hp</div>
  <div><b id="s-cla">—</b> ClA</div>
  <div><b id="s-fan">—</b> kg fan downforce</div>
</div>

<div id="grip">
  <div class="cap">Sustained lateral grip against speed, km/h</div>
  <svg id="gsvg" viewBox="0 0 330 132" preserveAspectRatio="none"></svg>
  <div class="leg">
    <span class="a"><i style="background:#D8762F"></i>VX-1</span>
    <span class="b"><i style="background:#8E969C"></i>F1 reference</span>
  </div>
</div>

<div id="probe" aria-live="polite">
  <div class="nm" id="p-name"></div>
  <div class="md" id="p-grp"></div>
  <dl>
    <dt>Station</dt><dd id="p-sta"></dd>
    <dt>Material</dt><dd id="p-mat"></dd>
  </dl>
</div>

<div id="rail">
  <div id="railhead">
    <h2>Assemblies</h2>
    <span id="note">Click an assembly to hide it. Drag to orbit.</span>
  </div>
  <div id="groups"></div>
  <div id="controls">
    <button class="btn" id="skin" type="button" aria-pressed="false">Show engine</button>
    <button class="btn" id="tunnel-btn" type="button" aria-pressed="false">Wind tunnel</button>
    <button class="btn" id="fans" type="button" aria-pressed="false">Spin fans</button>
    <button class="btn" id="spin" type="button" aria-pressed="false">Turntable</button>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</div>

<div id="tunnel-host"></div>

<div id="load">
  <p id="loadtxt">Loading car…</p>
  <div id="bar"><i></i></div>
  <p id="err"></p>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "animejs":"https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm",

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {tweenNumber, fadeObject, flyCamera, revealPanel, revealRows,
        reducedMotion} from './anim.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {WindTunnel, buildPanel, renderReadout, drawSpanLoad}
  from './tunnel-ui.js';
import {drawLegend, speedColour, pressureColour}
  from './cfd-view.js';

const MM = 0.001;
const $ = s => document.querySelector(s);

// Anything inside named(...) or matching(...) is a claim that these are
// parts or groups in viewer/parts.json, and tools/validate_viewer.mjs
// checks the claim: a renamed part must not be able to go on quietly
// not matching.
const named = (...n) => n;
const matching = (...n) => n;

// The surfaces that come off when you look inside. `nose` and
// `engine_cover` were in this list and neither is a part: the tub is lofted
// in one piece from the nose to the tail, so hiding it hides both. The two
// dead names meant nothing, quietly -- a name that is not there just never
// matches.
const BODY = named('tub', 'sidepod_l', 'sidepod_r', 'airbox',
                   'sharkfin', 'cockpit_coaming');

let keyLight = null;   // cast shadows, and sized to the model in ready()
let scene, camera, renderer, controls, root, raycaster, clock;
let data, byGroup = new Map(), info = new Map(), pickable = [];
let hidden = new Set(), hovered = null, corners = [], viewDir;
let spinning = false, fansOn = false;
let spinners = [], byName = new Map(), tunnel = null, panel = null;

init();

async function init(){
  const stage = $('#stage');
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.62;
  // Self-shadowing. Without it every recess is exactly as bright as the
  // surface beside it, which is the difference between an object and a
  // lit diagram.
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x15181B);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(studioEnv()).texture;
  scene.environmentIntensity = 1.05;

  camera = new THREE.PerspectiveCamera(30, stage.clientWidth/stage.clientHeight, 0.05, 200);

  // Carbon fibre is nearly black and shows form only through its highlights,
  // so it needs several sources rather than one key.
  scene.add(
    keyLight = dir(0xFFF4E6, 2.10, -3.0, 4.4, 3.6),
    dir(0xC6D8E6, 1.05,  3.4,-2.6,-2.4),
    dir(0xFFFFFF, 0.95,  2.6, 2.2,-3.4),
    new THREE.HemisphereLight(0xE6EEF2, 0x8E969C, 0.34),
    new THREE.AmbientLight(0xC0C8CE, 0.10),
  );

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.minDistance = 1.2;
  controls.maxDistance = 40;
  raycaster = new THREE.Raycaster();

  try{
    data = await (await fetch('parts.json?nocache=' + Date.now())).json();
  }catch(e){
    return fail('Could not read <code>parts.json</code>. Serve over HTTP: run '
              + '<code>make viewer</code> from the project root.');
  }
  fillSpec();
  drawGrip();
  buildRail();

  const draco = new DRACOLoader().setDecoderPath(
    'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
  new GLTFLoader().setDRACOLoader(draco).load('../build/car.glb?nocache=' + Date.now(),
    g => ready(g.scene),
    ev => {
      if(!ev.total) return;
      const p = Math.round(ev.loaded/ev.total*100);
      $('#bar i').style.width = p + '%';
      $('#loadtxt').textContent = `Loading car… ${p}%`;
    },
    // GLTFLoader routes anything thrown inside the success callback here too,
    // so report what actually went wrong rather than always blaming the file.
    e => {
      console.error(e);
      const why = e && e.message ? `<br><small>${e.message}</small>` : '';
      fail('Could not load <code>build/car.glb</code>. Run '
         + `<code>make export</code>.${why}`);
    });
}

function dir(c, i, x, y, z){
  const l = new THREE.DirectionalLight(c, i);
  l.position.set(x, y, z);
  return l;
}

function studioEnv(){
  // A metal only looks like metal when its reflection has CONTRAST: bright
  // sky above, dark floor below, and a couple of distinct softboxes that
  // streak across the surface as it turns. A uniform grey gradient reflects
  // as a uniform grey surface -- which is why the old lightbox read as clay.
  const w = 1024, h = 512;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.00, '#FDFEFF');
  grad.addColorStop(0.30, '#DDE5EA');
  grad.addColorStop(0.49, '#9AA6AE');
  grad.addColorStop(0.55, '#2A2F33');
  grad.addColorStop(1.00, '#0B0D0E');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  // two overhead softboxes and one low bounce strip: sharp specular streaks
  for(const [cx, cw, ci] of [[0.22, 0.10, 1.0], [0.62, 0.14, 0.85], [0.88, 0.06, 0.5]]){
    const p = g.createLinearGradient(0, h * 0.03, 0, h * 0.40);
    p.addColorStop(0, `rgba(255,252,246,${0.95 * ci})`);
    p.addColorStop(1, 'rgba(255,252,246,0)');
    g.fillStyle = p;
    g.fillRect(w * (cx - cw / 2), h * 0.03, w * cw, h * 0.37);
  }
  const t = new THREE.CanvasTexture(cv);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function fail(html){
  $('#loadtxt').textContent = 'Nothing to show yet';
  $('#bar').style.display = 'none';
  $('#err').innerHTML = html;
}

function fillSpec(){
  $('#s-dim').textContent =
    `${Math.round(data.length)} × ${Math.round(data.width)}`;
  $('#s-mass').textContent = Math.round(data.mass);
  $('#s-pwr').textContent = Math.round(data.hp).toLocaleString();
  $('#s-cla').textContent = data.cla.toFixed(2);
  $('#s-fan').textContent = Math.round(data.fan_kg);
}

function drawGrip(){
  const svg = $('#gsvg');
  const W = 330, H = 132, pad = {l: 26, r: 6, t: 8, b: 18};
  const g = data.grip;
  const xmax = Math.max(...g.map(d => d.kph));
  const xmin = Math.min(...g.map(d => d.kph));
  const ymax = Math.ceil(Math.max(...g.map(d => Math.max(d.ours, d.f1))));
  const X = v => pad.l + (v - xmin) / (xmax - xmin) * (W - pad.l - pad.r);
  const Y = v => H - pad.b - (v / ymax) * (H - pad.t - pad.b);
  const path = key => g.map((d, i) => `${i ? 'L' : 'M'}${X(d.kph).toFixed(1)},${Y(d[key]).toFixed(1)}`).join('');
  const band = g.map(d => `${X(d.kph).toFixed(1)},${Y(d.ours).toFixed(1)}`).join(' ')
             + ' ' + g.slice().reverse().map(d => `${X(d.kph).toFixed(1)},${Y(d.f1).toFixed(1)}`).join(' ');

  let ticks = '';
  for(let v = 1; v <= ymax; v++){
    ticks += `<line x1="${pad.l}" y1="${Y(v)}" x2="${W-pad.r}" y2="${Y(v)}" stroke="#2C3134"/>`
           + `<text x="${pad.l-6}" y="${Y(v)+3.5}" fill="#6E767C" font-size="9" text-anchor="end">${v}g</text>`;
  }
  for(const d of [g[0], g[Math.floor(g.length/2)], g[g.length-1]]){
    ticks += `<text x="${X(d.kph)}" y="${H-5}" fill="#6E767C" font-size="9" text-anchor="middle">${d.kph}</text>`;
  }

  svg.innerHTML = ticks
    + `<polygon points="${band}" fill="#D8762F" opacity="0.16"/>`
    + `<path d="${path('f1')}" fill="none" stroke="#8E969C" stroke-width="1.6"/>`
    + `<path d="${path('ours')}" fill="none" stroke="#D8762F" stroke-width="2.2"/>`
;
}

function ready(model){
  root = model;
  root.traverse(o => {
    if(!o.isMesh) return;
    const nfo = data.parts[o.name];
    if(!nfo) return;
    o.material = o.material.clone();
    const alloy = data.palette[nfo.mat];
    if(alloy){
      o.material.color.setRGB(...alloy.rgb, THREE.LinearSRGBColorSpace);
      o.material.metalness = alloy.metal;
      o.material.roughness = Math.max(alloy.rough, 0.14);
    }
    o.material.side = THREE.DoubleSide;
    info.set(o, nfo);
    byName.set(o.name, o);
    pickable.push(o);
    // anything the manifest gave a pivot and a spin sign to is a rotor
    if(nfo.pivot && nfo.pivot.role === 'spin')
      spinners.push({o, pivot: nfo.pivot});
    if(!byGroup.has(nfo.g)) byGroup.set(nfo.g, []);
    byGroup.get(nfo.g).push(o);
  });

  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(root);
  buildTunnel(box);
  const size = box.getSize(new THREE.Vector3());

  /* Shadows, and something for them to land on. A transparent catcher takes
     the ground shadow without putting a visible floor slab in the picture. */
  if(keyLight){
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.0006;
    keyLight.shadow.normalBias = 0.012;
    const span = Math.max(size.x, size.y, size.z);
    const sc = keyLight.shadow.camera;
    sc.left = -span * 0.62; sc.right = span * 0.62;
    sc.top = span * 0.62; sc.bottom = -span * 0.62;
    sc.near = 0.05; sc.far = span * 6.0;
    sc.updateProjectionMatrix();
    root.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    const catcher = new THREE.Mesh(
      new THREE.PlaneGeometry(span * 4, span * 4),
      new THREE.ShadowMaterial({opacity: 0.32}));
    catcher.rotation.x = -Math.PI / 2;
    catcher.position.y = -size.y * 0.60;
    catcher.receiveShadow = true;
    scene.add(catcher);
  }
  corners = [];
  for(const sx of [-.5,.5]) for(const sy of [-.5,.5]) for(const sz of [-.5,.5])
    corners.push(new THREE.Vector3(size.x*sx, size.y*sy, size.z*sz));
  viewDir = new THREE.Vector3(0.52, -0.30, -0.80).normalize();
  resetView();

  addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('pointerleave', () => setProbe(null));
  window.__dbg = {scene, camera, renderer, root, byGroup, tunnel, controls};
  $('#load').classList.add('done');
  renderer.setAnimationLoop(tick);
}

function fitDistance(dirv, margin = 1.24){
  const up = new THREE.Vector3(0,1,0);
  const right = new THREE.Vector3().crossVectors(dirv, up).normalize();
  const camUp = new THREE.Vector3().crossVectors(right, dirv).normalize();
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
  const th = tv * camera.aspect;
  let d = 0;
  for(const c of corners){
    const depth = c.dot(dirv);
    d = Math.max(d, Math.abs(c.dot(right))/th - depth,
                    Math.abs(c.dot(camUp))/tv - depth);
  }
  return d * margin;
}

function resetView(){
  controls.target.set(0,0,0);
  camera.position.copy(viewDir).multiplyScalar(-fitDistance(viewDir));
  camera.lookAt(0,0,0);
  controls.update();
}

function onResize(){
  const s = $('#stage');
  camera.aspect = s.clientWidth/s.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(s.clientWidth, s.clientHeight);
}

function buildTunnel(box){
  if(!data.tunnel) return;
  panel = buildPanel($('#tunnel-host'), data.tunnel,
                     (id, v) => tunnel.set(id, v),
                     () => retrace());
  /* Flow ports: the air the car itself moves.
   *
   * The engine breathes through the roof airbox, and the two fans pull air
   * out of the sealed floor and blow it out at the rear -- that is the whole
   * point of the machine, and until now the wind tunnel could not see any of
   * it. Each port is a softened point source in the solver frame (x aft,
   * y span, z up, metres); negative Q ingests, positive blows. The fan pair
   * follows the Spin Fans button, so the streamlines re-solve the moment you
   * switch the car's own airflow on.
   */
  function flowPorts(state){
    const v = state && state.v ? state.v/68 : 1;
    const fq = fansOn ? 9.0*v : 0;
    /* The fan pair balances itself -- what it pulls out of the floor it blows
     * out at the rear. The engine did not: the airbox was a sink with nothing
     * answering it, which leaves a net monopole that the source solve reads as
     * a far-field inflow over the whole car. The tailpipe closes it. Exhaust
     * gas leaves around 800 K against 288 K ambient, so in an incompressible
     * solve the same mass needs roughly 2.6x the volume going out. */
    const aq = 2.4*v;
    const ports = [
      {p: [2.20, 0.00, 0.78], Q: -aq,      r: 0.10},  // airbox -> engine
      {p: [4.53, 0.00, 0.47], Q:  aq*2.6,  r: 0.11},  // tailpipe, above the diffuser
      {p: [4.40, -0.30, 0.30], Q: -fq,  r: 0.14},  // fan L, pulling the floor
      {p: [4.40,  0.30, 0.30], Q: -fq,  r: 0.14},  // fan R
      {p: [4.72, -0.30, 0.24], Q:  fq,  r: 0.12},  // fan L exhaust, aft
      {p: [4.72,  0.30, 0.24], Q:  fq,  r: 0.12}, // fan R exhaust
    ];
    return fq === 0 ? ports.filter(q => q.Q !== 0) : ports;
  }

  tunnel = new WindTunnel({
    cfg: data.tunnel, scene, root, parts: byName, manifest: data.parts,
    bounds: box.clone().translate(root.position),
    bodyPanels: data.body_panels,
    nLines: 560,
    ports: (state) => flowPorts(state),
    onSolve: r => {
      // the fans add a near speed-independent term the lattice knows nothing
      // about, so it is reported separately rather than folded in
      const wings = Math.abs(r.lift_N/9.81);
      const fan = data.tunnel.fan_kg;
      let front = 0, tot = 0;
      // read it off the report, not off `tunnel` -- the first solve happens
      // inside the constructor, before `tunnel` has been assigned
      for(const [k, v] of Object.entries(r.bySurface)){
        tot += v;
        if(data.tunnel.front_surfaces.includes(k)) front += v;
      }
      renderReadout($('#t-readout'), {...r, frontFrac: tot ? front/tot : 0},
                    data.tunnel, 'car');
      drawSpanLoad($('#t-span'), r.strips);
      $('#t-panels').textContent =
        `${r.panels} panels · ${(r.v*3.6).toFixed(0)} km/h`;
      $('#t-note').className = 'tnote';
      $('#t-note').textContent =
        `Forces are the wings only, in ground effect. The floor, the tunnels `
        + `and the fans (a further ${fan} kg, near constant with speed) are `
        + `not in the force solve. The streamlines do include the body: tub, `
        + `sidepods, wheels and floor, as ${data.body_panels.n} source panels.`;
      $('#t-about').textContent = ABOUT;
    },
  });
  panel.sync(tunnel.state);
}

const ABOUT =
  'Two fans pull air out of a sealed underfloor. A wing makes downforce with '
  + 'the square of speed, so in a hairpin it has almost none left; a fan holds '
  + 'a pressure difference under a sealed floor, so its downforce barely '
  + 'changes with speed — worth little at 300 km/h and everything at 80. It '
  + 'also costs shaft power rather than induced drag, so the car can run less '
  + 'wing for the same total load and go faster in a straight line. Brabham '
  + 'won with one and withdrew it; the concept was banned, not beaten.';

// --- flow view switches (injected) ---

/* The legend follows whatever is on screen.
 *
 * One fixed velocity bar used to be drawn whatever you were looking at, which
 * meant that with surface pressure up the colours on the car had no key at
 * all. Speed gets a Turbo bar with freestream marked; pressure gets a
 * diverging bar with Cp = 0 marked, because those are the two reference values
 * a reader needs to turn a colour back into a number.
 */
function paintLegend(r){
  const cv = $('#t-legend');
  if(!cv || !r) return;
  const showCp = panel && panel.views && panel.views.surface;
  if(showCp){
    const cr = tunnel.cpRange() || {lo: -2, hi: 1};
    /* Label the scale that is drawn, not the extremes that were found.
     *
     * The first version printed the observed range, which on the car reads
     * "Cp -12.49 to 1.00" -- a number set by a single panel sitting on a
     * point-source singularity, on a bar that actually runs to -1.45. A
     * legend has one job and that is to let a colour be read back as a
     * number; labelling it with a range it does not cover fails that job
     * completely. */
    panel.setLegendCaption(
      `Surface pressure · C\u209A ${cr.lo.toFixed(2)} to ${cr.hi.toFixed(2)}`);
    drawLegend(cv, cr.lo, cr.hi, 'C\u209A [-]',
               {map: pressureColour, zeroAt: 0});
    panel.setHow('Blue is below ambient: suction, and every newton of '
               + 'downforce comes from it. Red is stagnation, where the air '
               + 'has been brought to rest against a surface.');
  } else {
    panel.setLegendCaption('Local air speed');
    drawLegend(cv, r.vmin * 3.6, r.vmax * 3.6, 'Velocity [km/h]',
               {map: speedColour, ref: r.vfs * 3.6, refLabel: 'V\u221E'});
    panel.setHow('Colour is speed; the mark is the wind speed itself, so '
               + 'anything left of it has been slowed and anything right of '
               + 'it accelerated. The pulses travel at the local speed.');
  }
}

/* Every mesh the pressure map can be painted onto. */
function flowMeshes(){
  const out = [];
  if(root) root.traverse(o => { if(o.isMesh && o.visible !== false) out.push(o); });
  return out;
}

/* Hand the flow view the geometry it paints on, and connect the switches. */
function wireFlowViews(){
  if(!tunnel || !panel || !panel.onView) return;
  tunnel.setMeshes(flowMeshes());
  panel.onView((id, on) => {
    tunnel.setLayer(id, on);
    if(id === 'surface' || id === 'plane'){
      const r = tunnel.lastResult;
      if(r) paintLegend(r);
    }
  });
}

function retrace(){
  if(!tunnel || !tunnel.state.on) return;
  const st = $('#t-status');
  st.className = 'tstatus busy';
  st.textContent = 'Tracing streamlines…';
  /* Trace in slices, drawing as the lines arrive.
   *
   * This used to be one blocking call behind two requestAnimationFrames whose
   * only job was to get the "tracing..." message painted before the tab froze
   * for four seconds. The work is the same; it is spread over frames now, so
   * the model can still be orbited while the flow fills in and the progress is
   * a count rather than a spinner. */
  tunnel.retraceProgressive((done, total) => {
    st.textContent = `Tracing streamlines… ${done} of ${total}`;
  }).then(r => {
    if(r){
      tunnel.lastResult = r;
      paintLegend(r);
      st.className = 'tstatus';
      // where the time actually went, rather than a guess in a comment
      const T = r.timing || {};
      const ph = ['solve','trace','cp','ribbons','arrows']
        .filter(k => T[k] > 4)
        .map(k => `${k} ${T[k].toFixed(0)}`).join(' · ');
      st.title = ph;
      st.textContent = `${r.lines} streamlines · ${r.ms.toFixed(0)} ms · `
                     + `${data.body_panels.n} body panels`;
      paintLegend(r);
    }
  });
}

function setTunnel(on){
  if(!tunnel) return;
  $('#tunnel').classList.toggle('on', on);
  $('#tunnel-btn').setAttribute('aria-pressed', String(on));
  tunnel.setOn(on);
  if(on){
    panel.sync(tunnel.state);
    wireFlowViews();
    // one orchestrated entrance, not a transition on every element
    revealPanel(panel.el.querySelector('.twrap'));
    retrace();
    spinning = false;
    $('#spin').setAttribute('aria-pressed', 'false');
  }
}

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if(spinning && root) root.rotation.y += dt * 0.32;
  /* Each fan turns about its own shaft.
   *
   * This used to rotate the single joined `fan_rotors` mesh about x. Two
   * things were wrong with that: the object's origin was the middle of the
   * car, so the fans swung around the centreline instead of turning; and the
   * axis was wrong anyway, because the fans are vertical -- they pull air up
   * out of the floor. The rotors are now separate objects whose origins sit
   * on their own shafts, and the manifest carries the axis, so this just
   * reads it. The two turn opposite ways, as they do on the car, so the
   * change in fan speed leaves no net yaw torque. */
  if(fansOn){
    for(const s2 of spinners){
      const ax = s2.pivot.axis;
      const w = dt * 9.0 * s2.pivot.spin;
      // Blender z is three.js y after the Y-up export
      if(Math.abs(ax[2]) > 0.5) s2.o.rotation.y += w;
      else if(Math.abs(ax[1]) > 0.5) s2.o.rotation.z -= w;
      else s2.o.rotation.x += w;
    }
  }
  // the travelling pulse on the streamlines runs off this clock, so
  // the flow keeps moving without retracing anything
  if(tunnel) tunnel.update(dt);
  controls.update();
  renderer.render(scene, camera);
}

const ndc = new THREE.Vector2();
function onMove(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-r.left)/r.width)*2 - 1;
  ndc.y = -((e.clientY-r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickable.filter(o => o.visible), false)[0];
  setProbe(hit ? hit.object : null);
}

function setProbe(mesh){
  if(mesh === hovered) return;
  if(hovered && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
  hovered = mesh;
  const box = $('#probe');
  if(!mesh){ box.classList.remove('on'); return; }
  const nfo = info.get(mesh);
  const grp = data.groups.find(g => g.key === nfo.g);
  if(mesh.material.emissive) mesh.material.emissive.setHex(0x3a1d0a);
  $('#p-name').textContent = pretty(mesh.name);
  $('#p-grp').textContent = grp ? grp.label : nfo.g;
  $('#p-sta').textContent = `${Math.round(nfo.x0)} – ${Math.round(nfo.x1)} mm`;
  $('#p-mat').textContent = nfo.mat.replace(/_/g,' ');
  box.style.setProperty('--pa', grp ? grp.color : '#C06A30');
  box.classList.add('on');
}

function pretty(n){
  return n.replace(/_/g,' ')
          .replace(/\bl\b/,'left').replace(/\br\b/,'right')
          .replace(/\bcla\b/,'ClA')
          .replace(/^./, c => c.toUpperCase());
}

function buildRail(){
  const box = $('#groups');
  for(const g of data.groups){
    const el = document.createElement('button');
    el.className = 'grp'; el.type = 'button';
    el.style.setProperty('--c', g.color);
    el.setAttribute('aria-pressed','true');
    el.innerHTML = `<span class="sw"></span>${g.label}<span class="ct">${g.parts}</span>`;
    el.addEventListener('click', () => {
      const on = hidden.has(g.key);
      on ? hidden.delete(g.key) : hidden.add(g.key);
      el.setAttribute('aria-pressed', String(on));
      (byGroup.get(g.key)||[]).forEach(o => o.visible = on);
      if(hovered && !hovered.visible) setProbe(null);
    });
    box.appendChild(el);
  }

  $('#skin').addEventListener('click', () => {
    const b = $('#skin');
    const showing = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!showing));
    b.textContent = showing ? 'Show engine' : 'Hide engine';
    for(const o of pickable) if(BODY.includes(o.name)) o.visible = showing;
    $('#note').textContent = showing
      ? 'Click an assembly to hide it. Drag to orbit.'
      : 'Bodywork off. The RX-8V V8 is installed as a stressed member between '
        + 'the tub and the gearbox — with its radiators, fuel cell, battery and fans.';
  });
  $('#tunnel-btn').addEventListener('click', () => {
    setTunnel($('#tunnel-btn').getAttribute('aria-pressed') !== 'true');
  });

  $('#fans').addEventListener('click', () => {
    fansOn = !fansOn;
    $('#fans').setAttribute('aria-pressed', String(fansOn));
    // the fans are part of the flow now -- switch them and the tunnel has to
    // see it, not just the rotor animation. Forces are unchanged (the ports
    // are not in the lattice); only the picture re-solves.
    if(tunnel && tunnel.state.on) tunnel.retraceProgressive();
  });
  $('#spin').addEventListener('click', () => {
    spinning = !spinning;
    $('#spin').setAttribute('aria-pressed', String(spinning));
  });
  $('#reset').addEventListener('click', () => {
    resetView();
    if(root) root.rotation.y = 0;
    spinning = false; fansOn = false;
    $('#spin').setAttribute('aria-pressed','false');
    $('#fans').setAttribute('aria-pressed','false');
    hidden.clear();
    for(const list of byGroup.values()) list.forEach(o => o.visible = true);
    for(const el of document.querySelectorAll('.grp')) el.setAttribute('aria-pressed','true');
    const b = $('#skin');
    b.setAttribute('aria-pressed','false');
    b.textContent = 'Show internals';
  });
}
</script>
</body>
